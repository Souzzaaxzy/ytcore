[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ytcore"
version = "0.1.0"
description = "Dependency-free YouTube client (InnerTube) with no yt-dlp"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["youtube", "innertube", "audio", "download", "bot", "ffmpeg"]
dependencies = []

[project.optional-dependencies]
ffmpeg = ["imageio-ffmpeg>=0.4.9"]
dev = ["pytest>=7", "imageio-ffmpeg>=0.4.9"]

[tool.setuptools.packages.find]
include = ["ytcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
